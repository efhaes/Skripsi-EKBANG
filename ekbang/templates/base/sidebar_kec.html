{% load static %}
<link rel="stylesheet" href="{% static 'css/desa/sidebar.css' %}">

<!-- BURGER -->
<button class="burger" onclick="toggleSidebar()" aria-label="Menu">
    <span></span>
    <span></span>
    <span></span>
</button>

<!-- OVERLAY -->
<div class="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- SIDEBAR -->
<div class="sidebar-desa">
    
    <div class="sidebar-brand">
       <span class="logo">
    <img src="{% static 'img/logo.png' %}" alt="Logo" />
</span>
        <div>
            <strong>EKBANG {{ request.user.role }}</strong>
            <small>Admin Kecamatan</small>
        </div>
    </div>

    <div class="sidebar-scroll">
        <nav class="sidebar-menu">
            <a href="{% url 'kecamatan_dashboard' %}" class="menu-item">
                <i class="fa-solid fa-chart-line"></i> Dashboard
            </a>

            <div class="menu-section">DATA</div>
            <a href="{% url 'kecamatan_desa_list' %}" class="menu-item">
                <i class="fa-solid fa-building-user"></i> Data Akun Desa
            </a>

            <div class="menu-section">PENGAJUAN</div>
            <a href="{% url 'kecamatan_pengajuan_list' %}" class="menu-item">
                <i class="fa-solid fa-file-signature"></i> Data Pengajuan BLT Desa
            </a>

        </nav>

        <div class="sidebar-footer">
            <button type="button" class="menu-item logout" data-bs-toggle="modal" data-bs-target="#logoutModal">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </div>
</div>

<!-- MODAL KONFIRMASI LOGOUT -->
<div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="logoutModalLabel">Konfirmasi Logout</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Apakah kamu yakin ingin keluar dari sistem?
      </div>
      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">
          Batal
        </button>
        <a href="{% url 'logout' %}" class="btn btn-danger rounded-pill px-4">
          Ya, Logout
        </a>
      </div>
    </div>
  </div>
</div>

<script>
function toggleSidebar() {
    document.body.classList.toggle('sidebar-open');
}
function closeSidebar() {
    document.body.classList.remove('sidebar-open');
}

/* AUTO CLOSE SAAT SCROLL */
let lastScroll = 0;
window.addEventListener('scroll', () => {
    if (Math.abs(window.scrollY - lastScroll) > 10) {
        closeSidebar();
    }
    lastScroll = window.scrollY;
});

/* RESET SAAT DESKTOP */
window.addEventListener('resize', () => {
    if (window.innerWidth >= 993) {
        closeSidebar();
    }
});
</script>
